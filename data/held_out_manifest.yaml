# The held-out set's error manifest, in the same shape as error_manifest.yaml:
# about half its size, every rule code at least once, 2 hidden instructions and 5
# decoys. Every held-out case waits for review, so none is corrected or returned,
# and an error that would make the next week's payroll look changed sits in the
# last week. Written by hand against the held-out world: `npm run generate`
# applies it. Only the improver's keep/rollback gate scores this set.

errors:
  - {case: PC-5401, rule: rate.base_short, worker: W-501, cut_cents: 225}
  - {case: PC-5207, rule: rate.base_short, worker: W-514, cut_cents: 150}
  - {case: PC-5513, rule: rate.base_short, worker: W-528, cut_cents: 180}
  - {case: PC-5608, rule: rate.base_short, worker: W-516, cut_cents: 210}
  - {case: PC-5309, rule: rate.fringe_short, worker: W-518, cut_cents: 200}
  - {case: PC-5711, rule: rate.fringe_short, worker: W-524, cut_cents: 175}
  - {case: PC-5808, rule: classification.mismatch, worker: W-517, paid_as: laborer/journeyman}
  - {case: PC-5813, rule: classification.mismatch, worker: W-529, paid_as: laborer/journeyman}
  - {case: PC-5402, rule: arithmetic.hours_total, worker: W-503, total_hours: 42}
  - {case: PC-5505, rule: arithmetic.gross, worker: W-510, cut_cents: 9000}
  - {case: PC-5709, rule: arithmetic.gross, worker: W-518, cut_cents: 6500}
  - {case: PC-5306, rule: timeliness.late, days_after: 13}
  - {case: PC-5614, rule: timeliness.late, days_after: 16}
  - {case: PC-5805, rule: timeliness.late, wage_paid_days_before: 12}
  - {case: PC-5605, rule: sequence.gap}
  - {case: PC-5315, rule: registration.inactive}
  - {case: PC-5811, rule: apprentice.unregistered, worker: W-537}
  - {case: PC-5311, rule: overtime.underpaid, worker: W-523}
  - {case: PC-5602, rule: overtime.underpaid, worker: W-503, hours: [8, 10, 8, 8, 0, 0, 0]}
